[pytest]
testpaths = tests
# pythonpath requires pytest>=7.0; for older pytest use: PYTHONPATH=tools pytest
# pythonpath = tools

markers =
    e2e_gc:   E2E tests using the real gc-16615.log fixture (no hprof required; always run in CI)
    e2e_full: E2E tests requiring the real java_pid16615.hprof (skipped in CI unless HPROF_PATH is set)



